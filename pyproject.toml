[project]
name = "copier-testing-template"
version = "0.1.0"
description = ""
authors = [{ name = "MakerX", email = "cto@makerx.com.au" }]
requires-python = ">=3.12,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["python-dotenv>=1.0.0,<2"]

[dependency-groups]
dev = [
    "ruff>=0.9.4,<0.10",
    "pytest>=8.3.2,<9",
    "mypy>=1.1.1,<2",
    "pre-commit>=3.2.1,<4",
    "types-pyyaml>=6.0.12.9,<7",
    "pytest-xdist>=3.3.1,<4",
    "pytest-sugar>=1.0.0,<2",
]

[tool.uv]
package = false
default-groups = "all"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
lint.select = [
  "E",
  "F",
  "ANN",
  "UP",
  "N",
  "C4",
  "B",
  "A",
  "YTT",
  "W",
  "FBT",
  "Q",
  "RUF",
  "I",
]
lint.ignore = [
  "RET505", # allow else after return
  "SIM108", # allow if-else in place of ternary
  "E111",   # indentation is not a multiple of four
  "E117",   # over-indented
  "ISC001", # single line implicit string concatenation
  "ISC002", # multi line implicit string concatenation
  "Q000",   # bad quotes inline string
  "Q001",   # bad quotes multiline string
  "Q002",   # bad quotes docstring
  "Q003",   # avoidable escaped quotes
  "W191",   # indentation contains tabs
]
lint.unfixable = ["B", "RUF"]
extend-exclude = [
  "examples/*",       # Ignoring generated tests, ruff specific errors are to be caught by pytest
  "template_content",
  ".git",
  ".mypy_cache",
  ".ruff_cache",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
