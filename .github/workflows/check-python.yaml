name: Check Template

on:
  workflow_call:

jobs:
  check-python:
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pipx install uv

      - name: Install algokit decoupling branch
        run: uv tool install --force "git+https://github.com/algorandfoundation/algokit-cli@decoupling"

      - name: Run algokit localnet
        run: algokit localnet start

      - name: Install dependencies
        run: uv sync --locked

      - name: Check linting with Ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          uv run ruff check .

      - name: Configure git
        shell: bash
        run: |
          # set git user and email as test invoke git
          git config --global user.email "actions@github.com" && git config --global user.name "github-actions"

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          uv run pytest --junitxml=pytest-junit.xml

      - name: Check generated templates have been reviewed
        shell: bash
        run: |
          # Add untracked files as empty so they come up in diff
          git add -N ./examples
          # Look for changes in generated templates and error if there are any
          git diff --exit-code --minimal ./examples
