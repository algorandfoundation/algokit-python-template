name: Continuous Delivery of Template

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'

concurrency: release

permissions:
  contents: write

jobs:
  ci-check-python:
    name: Check Python
    uses: ./.github/workflows/check-python.yaml

  tag-release:
    runs-on: "ubuntu-latest"
    needs: ci-check-python
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag release
        id: tag
        uses: TriPSs/conventional-changelog-action@v3.18.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-commit: "false"
          tag-prefix: ""
          skip-on-empty: "false"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: ${{ steps.tag.outputs.skipped == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body: ${{ steps.tag.outputs.clean_changelog }}
